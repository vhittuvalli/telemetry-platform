<app-replay-viewer
  [replayId]="replayId()"
  (loaded)="loadedSession.set($event)"
  (relaunch)="openLaunch($event)"
/>

<button class="race" (click)="openPicker()" title="Choose another session">
  @if (current(); as r) {
    <span class="year">{{ r.year }}</span> {{ r.event }} · {{ r.session }}
  } @else {
    Choose a session
  }
  <span class="caret">▾</span>
</button>

@if (pickerOpen()) {
  <app-race-picker
    [replays]="replays()"
    [current]="replayId()"
    [closable]="!!replayId()"
    (select)="choose($event)"
    (close)="pickerOpen.set(false)"
    (built)="refreshReplays()"
    (goLive)="openLive($event)"
  />
}

@if (launchOpen()) {
  <app-launch-dialog [from]="launchFrom()" (launched)="choose($event)" (close)="launchOpen.set(false)" />
}

@if (liveDialog(); as mode) {
  <app-live-dialog [mode]="mode" [replays]="replays()" (watch)="choose($event)" (close)="liveDialog.set(null)" />
}
