<canvas #canvas tabindex="0"></canvas>

@if (timeRange(); as range) {
  @if (standings().length) {
    <app-leaderboard
      [rows]="standings()"
      [lap]="lapText()"
      [selected]="selectedDriver()"
      (select)="selectDriver($event)"
    />
  }
  @if (selectedState(); as state) {
    <app-dashboard [state]="state" [row]="selectedRow()" />
  }

  <div class="controls">
    <button class="play" (click)="togglePlay()">
      {{ playing() ? '❚❚' : '▶' }}
    </button>

    <span class="time">{{ formatTime(currentTime()) }}</span>

    <input
      class="timeline"
      type="range"
      [min]="range.start"
      [max]="range.end"
      step="0.1"
      [value]="currentTime()"
      (input)="onSeek($event)"
    />

    <span class="time">{{ formatTime(range.end) }}</span>

    <div class="speeds">
      @for (s of speeds; track s) {
        <button [class.active]="speed() === s" (click)="setSpeed(s)">{{ s }}×</button>
      }
    </div>

    <button [class.active]="showLabels()" (click)="toggleLabels()">Labels</button>
    <div class="speeds">
        <button [class.active]="cameraMode() === 'overview'" (click)="setCameraMode('overview')">Overview</button>
        <button [class.active]="cameraMode() === 'chase'" [disabled]="!selectedDriver()" (click)="setCameraMode('chase')">Chase</button>
        <button [class.active]="cameraMode() === 'onboard'" [disabled]="!selectedDriver()" (click)="setCameraMode('onboard')">Onboard</button>
    </div>
  </div>
} @else {
  <div class="loading">Loading race data…</div>
}
