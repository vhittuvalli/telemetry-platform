# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repo.
services:
  - type: web
    name: telemetry-platform
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # A race build peaks around 480 MB and fits in the free plan's 512 MB; memory is
      # released afterwards. Built races are lost on restart (no persistent disk on free).
      - key: ALLOW_BUILDS
        value: "true"
      # Monte Carlo starts a process per CPU, far more memory than 512 MB allows
      - key: ALLOW_MONTE_CARLO
        value: "false"
      - key: REPLAY_CACHE_SIZE
        value: "2"
